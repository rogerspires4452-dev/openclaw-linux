# Boot entry for the OpenClaw Linux install media (UEFI).
# mkarchiso substitutes %ARCH%, %INSTALL_DIR% and %ARCHISO_UUID% at build
# time. The kernel/initramfs live at /<install_dir>/boot/<arch>/ on both the
# ISO 9660 file system and the embedded FAT image; archisosearchuuid tells
# the archiso initramfs hooks which volume carries the airootfs image.
title   OpenClaw Linux (%ARCH%, UEFI)
sort-key 01
linux   /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.firstboot=no
