# SDDM autologin — Omarchy-style appliance boot: straight into the desktop
# session for the appliance user (no greeter prompt).
#
# Session is the uwsm-managed Hyprland entry shipped by the hyprland package
# (/usr/share/wayland-sessions/hyprland-uwsm.desktop, Exec `uwsm start -e -D
# Hyprland hyprland.desktop`). The reference Omarchy host autologins the same
# way but to its own omarchy.desktop session (uwsm + Hyprland + Quickshell
# shell); see docs/specs/desktop.md for the full-Omarchy opt-in.
#
# INSTALL-TIME REQUIREMENT: the User must exist on the installed system
# (archinstall user, or `useradd -m -G wheel openclaw` in the chroot). If a
# different username is chosen, update User= here to match. SDDM needs no
# extra group membership for autologin.
#
# Staged in the profile so the future scripted installer's airootfs overlay
# carries it onto installed systems; manual installs copy it per
# docs/specs/desktop.md.
[Autologin]
User=openclaw
Session=hyprland-uwsm.desktop
