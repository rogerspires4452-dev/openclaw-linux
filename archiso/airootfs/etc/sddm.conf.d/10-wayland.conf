# SDDM greeter compositor: run the greeter on Hyprland instead of Xorg.
# Mirrors the reference Omarchy host (/etc/sddm.conf.d/10-wayland.conf) and
# keeps the greeter on the same stack as the desktop session. The greeter
# compositor config is /usr/share/sddm/hyprland.lua (staged alongside).
# start-hyprland ships with the hyprland package.
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=start-hyprland -- --config /usr/share/sddm/hyprland.lua
