# mkinitcpio configuration for the OpenClaw Linux install media.
#
# This file (plus the matching 'archiso' preset in /etc/mkinitcpio.d/) makes
# the initramfs built inside the archiso build chroot carry the archiso
# hooks: on boot they locate the media by the archisosearchuuid kernel
# parameter, mount the airootfs image (squashfs) and switch into the live
# root. Without these hooks the ISO would not be bootable.
#
# Hook list mirrors archiso's releng profile (archiso 90); the 'microcode'
# hook embeds the CPU microcode (intel-ucode is in packages.x86_64).

HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
