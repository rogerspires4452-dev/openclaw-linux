# OpenClaw appliance desktop skeleton — Hyprland (classic config format).
#
# The reference Omarchy host drives Hyprland through Lua config plus its
# own bootstrap helpers (require("default.hypr.omarchy") and an autostart
# hook that launches the Quickshell shell). This skeleton intentionally uses
# the classic hyprland.conf format — equally supported by hyprland 0.56 —
# so the appliance desktop is self-contained until the full omarchy layer is
# adopted (see docs/specs/desktop.md, "Approximations").
#
# Session chain (SDDM autologin): hyprland-uwsm.desktop -> `uwsm start -e -D
# Hyprland hyprland.desktop` -> this config.
#
# Bar/launcher: waybar (stopgap for Omarchy's Quickshell bar) + fuzzel.
# OpenClaw dashboard autostarts once the gateway is healthy (wrapper waits
# up to 60s so the gateway user service — enabled at first-boot provisioning
# — is up before Chromium starts).
#
# Personalize freely; this file lives in the user's home after account
# creation (seeded from /etc/skel).

monitor = ,preferred,auto,1

exec-once = waybar
exec-once = /usr/local/bin/openclaw-dashboard-autostart

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(cba6f7ee)
    col.inactive_border = rgba(313244ee)
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 1.0
}

# Low-core appliance: animations off keeps input snappy.
animations {
    enabled = no
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

$mod = SUPER

# Windows
bind = $mod, Return, exec, foot
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen
bind = $mod, Space, togglefloating
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Launcher + workspaces
bind = $mod, D, exec, fuzzel
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, SHIFT, 1, movetoworkspace, 1
bind = $mod, SHIFT, 2, movetoworkspace, 2
bind = $mod, SHIFT, 3, movetoworkspace, 3
bind = $mod, SHIFT, 4, movetoworkspace, 4

# OpenClaw dashboard: land on workspace 1, never on top of fullscreen apps.
windowrule = workspace 1, class:^(openclaw-dash)$
