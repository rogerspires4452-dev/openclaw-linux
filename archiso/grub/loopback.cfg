# GRUB loopback config for the OpenClaw Linux install media.
#
# mkarchiso copies this to /boot/grub/loopback.cfg on the ISO when GRUB is
# not one of the profile's bootmodes, so an existing GRUB install can boot
# the ISO directly (grub> configfile /boot/grub/loopback.cfg after loopback
# mounting the ISO; ${iso_path} is set by the caller). %INSTALL_DIR%, %ARCH%
# and %ARCHISO_UUID% are substituted at build time. The img_dev/img_loop
# kernel parameters are what the archiso_loop_mnt initramfs hook consumes.

# Search for the ISO volume
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Set default menu entry
default=openclaw
timeout=15
timeout_style=menu

# Menu entries

menuentry "OpenClaw Linux appliance media (%ARCH%, ${archiso_platform})" --class openclaw --class gnu-linux --class gnu --class os --id 'openclaw' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}"
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
