# Syslinux configuration for the OpenClaw Linux install media (BIOS boot).
#
# mkarchiso copies every *.cfg from this directory to /boot/syslinux/ on the
# ISO, substituting %INSTALL_DIR%, %ARCH%, %ARCHISO_LABEL% and %ARCHISO_UUID%
# at build time. isolinux.bin (El Torito) falls back to syslinux.cfg when no
# isolinux.cfg exists, so this single file drives both the MBR (isohybrid)
# and optical (El Torito) BIOS boot paths.

INCLUDE archiso_head.cfg

DEFAULT openclaw
TIMEOUT 150

LABEL openclaw
TEXT HELP
Boot the OpenClaw Linux appliance media (BIOS).
It boots the live appliance; provisioning runs after install.
ENDTEXT
MENU LABEL OpenClaw Linux (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

INCLUDE archiso_tail.cfg
