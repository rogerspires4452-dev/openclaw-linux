#
# /etc/pacman.conf for OpenClaw Linux archiso builds
#
# This file configures pacman inside the mkarchiso build chroot: it decides
# which repositories the seed list in packages.x86_64 is resolved against.
#
# It mirrors a stock Arch Linux pacman.conf (verified against a fresh 2026
# install). Before a real ISO build, diff it against the current stock file
# (/etc/pacman.conf of the build host) — repository layout changes upstream
# and this skeleton should track it.
#
# The reference box (Omarchy/beelink) additionally enables the [omarchy]
# repository; that is intentionally NOT included here so the ISO builds
# against plain Arch mirrors only.
#
# The "Include = /etc/pacman.d/mirrorlist" lines resolve inside the build
# chroot to the build host's mirrorlist, exactly like a normal install.

[options]
# Pacman won't upgrade packages listed in IgnorePkg and members of IgnoreGroup
#HoldPkg     = pacman glibc
# Architecture to be used (auto = current machine's architecture)
Architecture = auto

# Pacman won't check space usage by default. Set to true to enable.
#CheckSpace

# Sync databases and update the system via a single transaction
# in the same way as `pacman -Syuu`. Defaults to false.
#SyncThenUpdate = true

# Pacman can only be used as root; uncomment this to let members of a
# user group use pacman too.
#LocalFileSigLevel = Optional
#SigLevel = Required DatabaseOptional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
