name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck provision + installer scripts (POSIX sh)
        run: shellcheck -s sh provision/*.sh provision/steps/*.sh install/*.sh archiso/airootfs/root/install-openclaw.sh

      - name: Markdownlint root and docs markdown
        run: npx --yes markdownlint-cli@0.49.1 "*.md" "docs/**/*.md"
